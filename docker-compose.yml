services:

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - TZ=Europe/Berlin
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Switzerland

    ports:
      - 5800:5800
    restart: unless-stopped

  jdownloader:
    image: jlesage/jdownloader-2
    container_name: jdownloader
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Berlin
      - EXTRACTION_PASSWORDS=${EXTRACTION_PASSWORDS}
      - KEEP_APP_RUNNING=1
      - WEB_FILE_MANAGER=1
      - WEB_FILE_MANAGER_ALLOWED_PATHS=/watch
      - VNC_LISTENING_PORT=-1
      - SECURE_CONNECTION=1
      - WEB_AUTHENTICATION=1
      - WEB_AUTHENTICATION_USERNAME=admin
      - WEB_AUTHENTICATION_PASSWORD=${WEB_AUTHENTICATION_PASSWORD}

    volumes:
      - ./config/jdownloader:/config:Z,rw
      - ${DOWNLOADS_PATH}:/output:Z,rw
      - ./init-jd-config.sh:/etc/cont-init.d/99-jd-config.sh:Z,ro
    restart: unless-stopped
  