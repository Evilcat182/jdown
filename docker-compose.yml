services:

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - TZ=Europe/Berlin
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Switzerland
    healthcheck:
      test: /gluetun-entrypoint healthcheck
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    ports:
      - 5800:5800
      - 5801:5801
      - 3128:3128
    restart: unless-stopped

  firefox:
    image: jlesage/firefox:latest
    container_name: firefox
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Berlin
      - WEB_LISTENING_PORT=5801
      - VNC_LISTENING_PORT=-1
      - KEEP_APP_RUNNING=1
      - FF_OPEN_URL=${FF_OPEN_URL} # Multiple URLs can be opened by separating them with the pipe character
      - CONTAINER_DEBUG=${DEBUG}
    volumes:
      - ./config/firefox:/config:Z,rw
      - ./init/init-firefox.sh:/etc/cont-init.d/99-firefox.sh:Z,ro
    restart: unless-stopped

  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3128/jd/version || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Berlin
      - WEB_LISTENING_PORT=5800
      - VNC_LISTENING_PORT=-1
      - KEEP_APP_RUNNING=1
      - SECURE_CONNECTION=1
      - WEB_AUTHENTICATION=1
      - WEB_AUTHENTICATION_USERNAME=admin
      - WEB_AUTHENTICATION_PASSWORD=${WEB_AUTHENTICATION_PASSWORD}
      - CONTAINER_DEBUG=${DEBUG}

    volumes:
      - ./config/jdownloader:/config:Z,rw
      - ${DOWNLOADS_PATH}:/output:z,rw
      - ./init/init-jdownloader.sh:/etc/cont-init.d/99-init-jdownloader.sh:Z,ro
    restart: unless-stopped

  jdown-bot:
    build: ./jdown-bot
    container_name: jdown-bot
    stop_signal: SIGINT
    depends_on:
      jdownloader:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      - API_BASE_URL=http://gluetun:3128
      - DEBUG=${DEBUG}
      - TZ=Europe/Berlin
      - EXTRACTION_PASSWORDS=${EXTRACTION_PASSWORDS}
      - PREMIUM_ACCOUNT_HOSTER=${PREMIUM_ACCOUNT_HOSTER}
      - PREMIUM_ACCOUNT_USERNAME=${PREMIUM_ACCOUNT_USERNAME}
      - PREMIUM_ACCOUNT_PASSWORD=${PREMIUM_ACCOUNT_PASSWORD}
      - AUTOSTART_DOWNLOADS=1
      - AUTOORGANIZE_DOWNLOADS=1
      - DELETE_SOURCE=0
      - PLEX_SCAN_ENABLED=1
      - AUTOANSWER_DIALOGS=1
      - MOVIE_DESTINATION=${MOVIE_DESTINATION}
      - SERIES_DESTINATION=${SERIES_DESTINATION}
      - PLEX_API_ROOT=${PLEX_API_ROOT}
      - PLEX_TOKEN=${PLEX_TOKEN}
    volumes:
      - ./jdown-bot:/app:Z,rw
      - ${DOWNLOADS_PATH}:/output:z,rw
      - ${MOVIE_DESTINATION}:${MOVIE_DESTINATION}:Z,rw
      - ${SERIES_DESTINATION}:${SERIES_DESTINATION}:Z,rw
    restart: unless-stopped

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/29