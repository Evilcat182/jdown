services:

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - TZ=Europe/Berlin
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Switzerland
      - SERVER_HOSTNAMES_NOT=*onion*
      # ── Built-in HTTP proxy (for mobile device proxy settings) ──────────────
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      # ── Server list: refresh daily, stored in the gluetun volume ───────────
      - UPDATER_PERIOD=24h
      # ── Control server (port 8000, internal only — used by jbot) ───────────
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set GLUETUN_API_KEY in .env}"}'
    volumes:
      - jdown_config_gluetun:/gluetun:z,rw
    healthcheck:
      test: /gluetun-entrypoint healthcheck
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    ports:
      - 5800:5800   # Jdownloader WebUI 
      - 5801:5801   # Firefox WebUI
      - 8888:8888   # HTTP proxy for mobile browsers
      - 9666:9666   # JDownloader Click & Load
    restart: unless-stopped

  firefox:
    image: jlesage/firefox:v26.09.1
    container_name: firefox
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Berlin
      - WEB_LISTENING_PORT=5801
      - VNC_LISTENING_PORT=-1
      - KEEP_APP_RUNNING=1
      - FF_OPEN_URL=${FF_OPEN_URL} # Multiple URLs can be opened by separating them with the pipe character
      - CONTAINER_DEBUG=${DEBUG}
    volumes:
      - jdown_config_firefox:/config:Z,rw
      - ./init/init-firefox.sh:/etc/cont-init.d/99-firefox.sh:Z,ro
    restart: unless-stopped

  jdownloader:
    image: jlesage/jdownloader-2:v26.09.1
    container_name: jdownloader
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3128/jd/version || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Berlin
      - WEB_LISTENING_PORT=5800
      - VNC_LISTENING_PORT=-1
      - KEEP_APP_RUNNING=1
      - SECURE_CONNECTION=1
      - WEB_FILE_MANAGER=1
      - WEB_FILE_MANAGER_ALLOWED_PATHS=/output
      - CONTAINER_DEBUG=${DEBUG}

    volumes:
      - jdown_config_jdownloader:/config:Z,rw
      - ${DOWNLOADS_PATH:-jdown_downloads}:/output:z,rw
      - ./init/init-jdownloader.sh:/etc/cont-init.d/99-init-jdownloader.sh:Z,ro
    restart: unless-stopped

  jbot:
    build: ./jbot
    container_name: jbot
    stop_signal: SIGINT
    depends_on:
      jdownloader:
        condition: service_started   # startup.py waits for the JD API itself
    ports:
      - 8080:8080
    environment:
      - API_BASE_URL=http://gluetun:3128
      - DEBUG=${DEBUG}
      - TZ=Europe/Berlin
      - EXTRACTION_PASSWORDS=${EXTRACTION_PASSWORDS}
      - PREMIUM_ACCOUNT_HOSTER=${PREMIUM_ACCOUNT_HOSTER}
      - PREMIUM_ACCOUNT_USERNAME=${PREMIUM_ACCOUNT_USERNAME}
      - PREMIUM_ACCOUNT_PASSWORD=${PREMIUM_ACCOUNT_PASSWORD}
      - PLEX_API_ROOT=${PLEX_API_ROOT}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_MOVIE_LIB_NAME=${PLEX_MOVIE_LIB_NAME}
      - PLEX_SHOW_LIB_NAME=${PLEX_SHOW_LIB_NAME}
      - GLUETUN_API_URL=http://gluetun:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
    volumes:
      - jdown_config_jbot:/config:Z,rw
      - jdown_config_gluetun:/gluetun:z,ro   # read servers.json for the VPN server picker
      - ${DOWNLOADS_PATH:-jdown_downloads}:/output:z,rw
      - ${MOVIE_DESTINATION:-jdown_movies}:/data/movies:z,rw
      - ${SERIES_DESTINATION:-jdown_series}:/data/series:z,rw
    restart: unless-stopped

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/29

volumes:
  jdown_downloads:
  jdown_movies:
  jdown_series:
  jdown_config_firefox:
  jdown_config_jdownloader:
  jdown_config_jbot:
  jdown_config_gluetun: