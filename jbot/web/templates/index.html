<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>J-BOT</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 40px 24px 32px; background: #f5f5f5; box-sizing: border-box; }
    .controls { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.3rem; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .label { font-size: 0.95rem; font-weight: 500; cursor: default; }
    .badge { font-size: 0.8rem; padding: 2px 10px; border-radius: 12px; margin-left: 10px; }
    .on  { background: #d4edda; color: #155724; }
    .off { background: #f8d7da; color: #721c24; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 18px;
             font-size: 0.85rem; font-weight: 600; }
    .btn-disable { background: #dc3545; color: #fff; }
    .btn-enable  { background: #28a745; color: #fff; }
    .btn-restart { background: #6c757d; color: #fff; }
    .btn-restart:hover { background: #dc3545; }

    /* Log panel */
    #log-panel { background: #1e1e1e; border-radius: 8px; padding: 12px 14px;
                 margin-top: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    #log-panel h2 { color: #ccc; font-size: 0.85rem; margin: 0 0 10px; letter-spacing: .05em; text-transform: uppercase; }
    #log-output { height: calc(100vh - 520px); min-height: 200px; overflow-y: auto;
                  font-family: monospace; font-size: 0.78rem;
                  line-height: 1.55; white-space: pre-wrap; word-break: break-all; }
    .log-info    { color: #d4d4d4; }
    .log-debug   { color: #6a9955; }
    .log-warning { color: #d7ba7d; }
    .log-error   { color: #f44747; }
    .log-success { color: #4ec9b0; }
    .log-ts      { color: #555; margin-right: 6px; }
    .log-prefix  { color: #888; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="controls">
  <h1>jbot</h1>

  <div class="card" id="card-linkgrabber">
    <span class="label" title="Will automatically start downloading any grabed link">
      Autostart Downloads
      <span class="badge" id="badge-linkgrabber"></span>
    </span>
    <button id="btn-linkgrabber" onclick="toggle('linkgrabber')"></button>
  </div>

  <div class="card" id="card-downloads">
    <span class="label" title="Will cleanup any unnecessary files, rename files and folders and move them to final destination">
      Auto organize when finished
      <span class="badge" id="badge-downloads"></span>
    </span>
    <button id="btn-downloads" onclick="toggle('downloads')"></button>
  </div>

  <div class="card" id="card-plex">
    <span class="label" title="Triggers a Plex library scan after a download has been organized">
      Invoke Plex Media Scan after successfull download
      <span class="badge" id="badge-plex"></span>
    </span>
    <button id="btn-plex" onclick="toggle('plex')"></button>
  </div>

  <div class="card" id="card-delete_source">
    <span class="label" title="Will delete extracted source folder from downloads path, if copy was successfull">
      Delete downloaded source
      <span class="badge" id="badge-delete_source"></span>
    </span>
    <button id="btn-delete_source" onclick="toggle('delete_source')"></button>
  </div>

  <div class="card" id="card-dialogs">
    <span class="label" title="Auto-answer JDownloader dialogs (e.g. external link requests)">
      Auto-answer Dialogs
      <span class="badge" id="badge-dialogs"></span>
    </span>
    <button id="btn-dialogs" onclick="toggle('dialogs')"></button>
  </div>

  <div class="card">
    <span class="label" title="Restart the jbot process">Restart jbot</span>
    <button class="btn-restart" id="btn-restart" onclick="restart()">Restart</button>
  </div>

  <div class="card" style="flex-direction: column; align-items: stretch; gap: 10px;">
    <span class="label" title="Manually organize a folder by path">Manual Organize</span>
    <div style="display: flex; gap: 8px;">
      <input id="organize-path" type="text" placeholder="/path/to/folder"
             style="flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem;">
      <button id="btn-organize" onclick="organizeManual()" style="background: #0d6efd; color: #fff;">Organize</button>
    </div>
  </div>

  </div><!-- /.controls -->

  <div id="log-panel">
    <h2>Log</h2>
    <div id="log-output"></div>
  </div>

  <script>
    // ── Watcher toggles ──────────────────────────────────────────────────────
    function applyStatus(data) {
      for (const [key, enabled] of Object.entries(data)) {
        const badge = document.getElementById('badge-' + key);
        const btn   = document.getElementById('btn-'   + key);
        if (!badge) continue;
        badge.textContent = enabled ? 'ON' : 'OFF';
        badge.className   = 'badge ' + (enabled ? 'on' : 'off');
        btn.textContent   = enabled ? 'Disable' : 'Enable';
        btn.className     = enabled ? 'btn-disable' : 'btn-enable';
      }
    }
    function refresh() {
      fetch('/api/status').then(r => r.json()).then(applyStatus);
    }
    function toggle(watcher) {
      fetch('/api/toggle/' + watcher, {method: 'POST'})
        .then(r => r.json()).then(applyStatus);
    }
    function organizeManual() {
      const path = document.getElementById('organize-path').value.trim();
      if (!path) return;
      const btn = document.getElementById('btn-organize');
      btn.textContent = 'Running…';
      btn.disabled = true;
      fetch('/api/organize', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path})
      })
        .then(r => r.json())
        .catch(() => ({}))
        .finally(() => { btn.textContent = 'Organize'; btn.disabled = false; });
    }

    function restart() {
      const btn = document.getElementById('btn-restart');
      btn.textContent = 'Restarting…';
      btn.disabled = true;
      fetch('/api/restart', {method: 'POST'})
        .catch(() => {})
        .finally(() => setTimeout(() => { btn.textContent = 'Restart'; btn.disabled = false; }, 3000));
    }

    // ── Log panel ────────────────────────────────────────────────────────────
    let lastId = 0;
    const output = document.getElementById('log-output');

    function appendLogs(entries) {
      if (!entries.length) return;
      const atBottom = output.scrollHeight - output.scrollTop <= output.clientHeight + 4;
      for (const e of entries) {
        const line = document.createElement('div');
        line.className = 'log-' + e.type;
        const ts     = `<span class="log-ts">${e.ts}</span>`;
        const prefix = e.prefix ? `<span class="log-prefix">${e.prefix}</span>` : '';
        const label  = e.type === 'error' ? 'ERROR: ' : '';
        line.innerHTML = ts + prefix + label + escHtml(e.message);
        output.appendChild(line);
        lastId = e.id;
      }
      if (atBottom) output.scrollTop = output.scrollHeight;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function pollLogs() {
      fetch('/api/logs?after=' + lastId)
        .then(r => r.json())
        .then(appendLogs)
        .catch(() => {});
    }

    refresh();
    pollLogs();
    setInterval(refresh,   5000);
    setInterval(pollLogs,  2000);
  </script>
</body>
</html>
