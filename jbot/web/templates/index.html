<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0d10;
      --surface:    #17171c;
      --surface-2:  #1f1f26;
      --border:     #2a2a34;
      --border-2:   #35353f;
      --text-1:     #ededf0;
      --text-2:     #8e8e9e;
      --text-3:     #55555f;
      --accent:     #6366f1;
      --accent-h:   #4f46e5;
      --green:      #22c55e;
      --amber:      #f59e0b;
      --red:        #ef4444;
      --radius:     10px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      padding: 32px 16px 56px;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .layout {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    .brand-name { font-size: 17px; font-weight: 600; letter-spacing: -0.025em; }
    .brand-sub  { font-size: 11px; color: var(--text-3); margin-top: 1px; }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-2);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.13s, background 0.13s, border-color 0.13s;
    }
    .icon-btn:hover { color: var(--text-1); background: var(--surface-2); border-color: var(--border-2); }
    .icon-btn svg { width: 16px; height: 16px; }

    .btn-danger {
      background: transparent; color: var(--red);
      border: 1px solid rgba(239,68,68,.25);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,.08); }
    .btn-sm { padding: 5px 11px; font-size: 12px; }

    /* ── Section label ─────────────────────────────────────────────────────── */
    .section-label {
      font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    /* ── Action card ───────────────────────────────────────────────────────── */
    .action-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .action-card-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
    }
    .action-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .action-desc  { font-size: 11.5px; color: var(--text-3); line-height: 1.55; }

    /* ── Buttons ───────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px;
      border: none; border-radius: 7px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: background 0.13s, opacity 0.13s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
    .btn-sm { padding: 5px 13px; font-size: 12px; }

    /* ── Log panel ─────────────────────────────────────────────────────────── */
    .log-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .log-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .log-header-left { display: flex; align-items: center; gap: 8px; }
    .log-live-dot {
      width: 6px; height: 6px;
      background: var(--green); border-radius: 50%;
      box-shadow: 0 0 5px var(--green);
      animation: livepulse 2.4s ease-in-out infinite;
    }
    @keyframes livepulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .log-title {
      font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.09em;
      color: var(--text-3);
    }
    .log-clear-btn {
      font-size: 11px; color: var(--text-3);
      background: none; border: none; cursor: pointer;
      padding: 3px 8px; border-radius: 4px; font-family: inherit;
      transition: color 0.13s, background 0.13s;
    }
    .log-clear-btn:hover { color: var(--text-1); background: var(--surface-2); }

    #log-output {
      padding: 10px 16px;
      height: calc(100vh - 420px);
      min-height: 200px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 11.5px;
      line-height: 1.75;
    }
    #log-output::-webkit-scrollbar { width: 5px; }
    #log-output::-webkit-scrollbar-track { background: transparent; }
    #log-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .log-line { display: flex; gap: 8px; align-items: baseline; }
    .log-ts     { color: var(--text-3); flex-shrink: 0; font-size: 11px; }
    .log-prefix { color: #a78bfa; flex-shrink: 0; }
    .log-msg    { word-break: break-all; }
    .log-info    .log-msg { color: #c9d1d9; }
    .log-debug   .log-msg { color: #6a9955; }
    .log-warning .log-msg { color: var(--amber); }
    .log-error   .log-msg { color: #f87171; }
    .log-error   .log-prefix { color: #f87171; }
    .log-success .log-msg { color: #34d399; }
    .log-success .log-prefix { color: #34d399; }

    /* ── Scan results ──────────────────────────────────────────────────────── */
    .scan-results-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px;
    }
    .scan-count { font-size: 12px; color: var(--text-2); }
    .scan-list  { display: flex; flex-direction: column; gap: 8px; }
    .scan-empty {
      text-align: center; padding: 22px;
      color: var(--text-3); font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .scan-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .scan-item.low-confidence { border-color: rgba(245,158,11,.35); }
    .scan-item.organized      { border-color: rgba(34,197,94,.35); opacity: .65; }

    .scan-item-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .scan-item-name {
      font-size: 12px;
      font-family: 'JetBrains Mono','Fira Code','Courier New',monospace;
      word-break: break-all; flex: 1; min-width: 0;
    }
    .scan-item-badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .type-badge {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      padding: 2px 7px; border-radius: 4px;
    }
    .type-movie   { background: rgba(99,102,241,.2);  color: #a5b4fc; }
    .type-episode { background: rgba(34,197,94,.14);  color: #6ee7b7; }
    .type-unknown { background: var(--surface-2);     color: var(--text-3); }
    .warn-badge {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      padding: 2px 7px; border-radius: 4px;
      background: rgba(245,158,11,.14); color: var(--amber);
    }

    .scan-fields {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px 10px;
    }
    .field-group { display: flex; flex-direction: column; gap: 3px; }
    .field-label {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-3);
    }
    .field-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px; font-family: inherit;
      color: var(--text-1); outline: none;
      transition: border-color 0.15s; width: 100%;
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: var(--text-3); }
    .field-select { cursor: pointer; appearance: none; }

    .scan-item-footer {
      padding: 9px 16px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end;
    }

    /* ── Downloads section ───────────────────────────────────────────────── */
    .dl-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 10px; gap: 10px;
    }
    .dl-header-left { display: flex; align-items: center; gap: 8px; }
    .dl-state-badge {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 2px 8px; border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-3);
    }
    .dl-state-badge.running  { color: var(--green);  border-color: rgba(34,197,94,.35);  background: rgba(34,197,94,.08); }
    .dl-state-badge.paused   { color: var(--amber);  border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.08); }
    .dl-state-badge.stopped  { color: var(--text-3); border-color: var(--border); }
    .dl-controls { display: flex; gap: 6px; }

    .dl-list { display: flex; flex-direction: column; gap: 8px; }
    .dl-empty {
      text-align: center; padding: 22px;
      color: var(--text-3); font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .dl-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dl-item-top {
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .dl-item-name {
      font-size: 12.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .dl-item-status {
      font-size: 11px; color: var(--text-3);
      flex-shrink: 0; white-space: nowrap;
    }
    .dl-item-status.running { color: var(--green); }
    .dl-item-status.finished { color: #a78bfa; }

    .dl-progress-track {
      height: 4px; border-radius: 2px;
      background: var(--surface-2); overflow: hidden;
    }
    .dl-progress-fill {
      height: 100%; border-radius: 2px;
      background: var(--accent);
      transition: width 0.4s ease;
    }
    .dl-progress-fill.finished { background: #a78bfa; }
    .dl-progress-fill.stopped  { background: var(--text-3); }

    .dl-item-meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 11px; color: var(--text-3);
    }
    .dl-meta-pct  { font-weight: 600; color: var(--text-2); min-width: 36px; }
    .dl-meta-speed { color: var(--green); }

    .dl-item-footer {
      display: flex; justify-content: flex-end;
      gap: 6px; padding-top: 4px;
    }
    .btn-pkg {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: background 0.13s, opacity 0.13s;
      white-space: nowrap;
    }
    .btn-pkg:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-pkg-start  { background: rgba(99,102,241,.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,.3); }
    .btn-pkg-start:hover:not(:disabled)  { background: rgba(99,102,241,.28); }
    .btn-pkg-stop   { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
    .btn-pkg-stop:hover:not(:disabled)   { background: var(--surface-2); }
    .btn-pkg-remove { background: transparent; color: var(--red); border: 1px solid rgba(239,68,68,.25); }
    .btn-pkg-remove:hover:not(:disabled) { background: rgba(239,68,68,.08); }

    @media (max-width: 480px) {
      body { padding: 20px 12px 48px; }
      .scan-fields { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-name">jbot</div>
          <div class="brand-sub">Download automation</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn btn-danger btn-sm" onclick="restart()">Restart</button>
        <a href="/settings" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
      </div>
    </header>

    <!-- Downloads -->
    <section>
      <div class="dl-header">
        <div class="dl-header-left">
          <span class="section-label" style="margin-bottom:0">Downloads</span>
          <span id="dl-state-badge" class="dl-state-badge">—</span>
        </div>
        <div class="dl-controls">
          <button class="btn btn-sm" id="btn-dl-stop"
            style="background:transparent;color:var(--text-2);border:1px solid var(--border);"
            onclick="dlStop()">Stop All</button>
          <button class="btn btn-primary btn-sm" id="btn-dl-start"
            onclick="dlStart()">Start All</button>
        </div>
      </div>
      <div id="dl-list" class="dl-list"></div>
    </section>

    <!-- Scan -->
    <section>
      <div class="section-label">Scanner</div>
      <div class="action-card">
        <div class="action-card-row">
          <div>
            <div class="action-title">Scan Output Folder</div>
            <div class="action-desc">Detect downloaded media, review &amp; edit properties, then organize.</div>
          </div>
          <button id="btn-scan" class="btn btn-primary" style="flex-shrink:0;" onclick="scanFolder()">Scan</button>
        </div>
      </div>
      <div id="scan-results"></div>
    </section>

    <!-- Log -->
    <section>
      <div class="log-panel">
        <div class="log-header">
          <div class="log-header-left">
            <div class="log-live-dot"></div>
            <span class="log-title">Live Log</span>
          </div>
          <button class="log-clear-btn" onclick="clearLog()">Clear</button>
        </div>
        <div id="log-output"></div>
      </div>
    </section>

  </div>

  <script>
    // ── Scan ──────────────────────────────────────────────────────────────────
    let _scanItems = [];

    function scanFolder() {
      const btn = document.getElementById('btn-scan');
      btn.textContent = 'Scanning…';
      btn.disabled = true;
      document.getElementById('scan-results').innerHTML = '';
      fetch('/api/scan')
        .then(r => r.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          _scanItems = data;
          renderScanResults(data);
        })
        .catch(err => {
          document.getElementById('scan-results').innerHTML =
            `<div class="scan-empty" style="color:var(--red);">Scan failed: ${escHtml(String(err))}</div>`;
        })
        .finally(() => { btn.textContent = 'Scan'; btn.disabled = false; });
    }

    function renderScanResults(items) {
      const container = document.getElementById('scan-results');
      if (!items.length) {
        container.innerHTML = '<div class="scan-empty">No media folders found.</div>';
        return;
      }
      const header = `
        <div class="scan-results-header">
          <span class="scan-count">${items.length} folder${items.length !== 1 ? 's' : ''} found</span>
          <button class="btn btn-primary btn-sm" onclick="organizeAll()">Organize All</button>
        </div>`;
      const list = items.map((item, i) => renderScanItem(item, i)).join('');
      container.innerHTML = header + '<div class="scan-list">' + list + '</div>';
    }

    function renderScanItem(item, i) {
      const type = item.type || '';
      const badgeClass = type === 'movie' ? 'type-movie' : type === 'episode' ? 'type-episode' : 'type-unknown';
      const warnBadge  = item.has_confidence ? '' : '<span class="warn-badge">low confidence</span>';
      const info = item.info || {};
      const lowCls = item.has_confidence ? '' : ' low-confidence';
      const v = (key, fallback = '') => escHtml(String(info[key] ?? fallback));
      const inp = (cls, key, placeholder = '') =>
        `<input class="field-input ${cls}" value="${v(key)}" placeholder="${escHtml(placeholder)}">`;
      const episodeOnlyStyle = type !== 'episode' ? ' style="display:none"' : '';
      return `
      <div class="scan-item${lowCls}" id="scan-item-${i}">
        <div class="scan-item-header">
          <span class="scan-item-name">${escHtml(item.name)}</span>
          <div class="scan-item-badges">
            ${warnBadge}
            <span class="type-badge ${badgeClass}">${type || 'unknown'}</span>
          </div>
        </div>
        <div class="scan-fields">
          <div class="field-group">
            <label class="field-label">Type</label>
            <select class="field-input field-select field-type" onchange="onTypeChange(this,${i})">
              <option value="movie"   ${type==='movie'   ? 'selected' : ''}>Movie</option>
              <option value="episode" ${type==='episode' ? 'selected' : ''}>Episode</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Title</label>
            ${inp('field-title', 'title')}
          </div>
          <div class="field-group">
            <label class="field-label">Year</label>
            ${inp('field-year', 'year', 'e.g. 2024')}
          </div>
          <div class="field-group field-ep"${episodeOnlyStyle}>
            <label class="field-label">Season</label>
            ${inp('field-season', 'season', 'e.g. 1')}
          </div>
          <div class="field-group field-ep"${episodeOnlyStyle}>
            <label class="field-label">Episode</label>
            ${inp('field-episode', 'episode', 'e.g. 4')}
          </div>
          <div class="field-group field-ep"${episodeOnlyStyle}>
            <label class="field-label">Episode Title</label>
            ${inp('field-episode-title', 'episode_title')}
          </div>
          <div class="field-group">
            <label class="field-label">Resolution</label>
            ${inp('field-screen-size', 'screen_size', 'e.g. 1080p')}
          </div>
          <div class="field-group">
            <label class="field-label">Video Codec</label>
            ${inp('field-video-codec', 'video_codec', 'e.g. x265')}
          </div>
          <div class="field-group">
            <label class="field-label">Source</label>
            ${inp('field-source', 'source', 'e.g. BluRay')}
          </div>
          <div class="field-group">
            <label class="field-label">Audio Codec</label>
            ${inp('field-audio-codec', 'audio_codec', 'e.g. DTS')}
          </div>
        </div>
        <div class="scan-item-footer">
          <button class="btn btn-sm btn-remove" onclick="removeFolder(${i})" style="background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.25);margin-right:auto;">Remove</button>
          <button class="btn btn-primary btn-sm btn-org" onclick="organizeItem(${i})">Organize</button>
        </div>
      </div>`;
    }

    function onTypeChange(sel, i) {
      const card = document.getElementById('scan-item-' + i);
      const isEpisode = sel.value === 'episode';
      card.querySelectorAll('.field-ep').forEach(el => el.style.display = isEpisode ? '' : 'none');
      const badge = card.querySelector('.type-badge');
      badge.className = 'type-badge ' + (isEpisode ? 'type-episode' : 'type-movie');
      badge.textContent = sel.value;
    }

    function getItemInfo(i) {
      const card = document.getElementById('scan-item-' + i);
      const gv = cls => (card.querySelector('.' + cls)?.value ?? '').trim();
      return {
        type:          gv('field-type') || undefined,
        title:         gv('field-title') || undefined,
        year:          gv('field-year') || undefined,
        season:        gv('field-season') || undefined,
        episode:       gv('field-episode') || undefined,
        episode_title: gv('field-episode-title') || undefined,
        screen_size:   gv('field-screen-size') || undefined,
        video_codec:   gv('field-video-codec') || undefined,
        source:        gv('field-source') || undefined,
        audio_codec:   gv('field-audio-codec') || undefined,
      };
    }

    function organizeItem(i) {
      const item = _scanItems[i];
      if (!item) return;
      const card = document.getElementById('scan-item-' + i);
      const btn  = card.querySelector('.btn-org');
      btn.textContent = 'Running…';
      btn.disabled = true;
      fetch('/api/organize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: item.path, info: getItemInfo(i) }),
      })
        .catch(() => {})
        .finally(() => {
          btn.textContent = 'Organize';
          btn.disabled = false;
          card.classList.add('organized');
        });
    }

    function organizeAll() { _scanItems.forEach((_, i) => organizeItem(i)); }

    function removeFolder(i) {
      const item = _scanItems[i];
      if (!item) return;
      const card = document.getElementById('scan-item-' + i);
      const btn  = card.querySelector('.btn-remove');
      if (!confirm('Delete "' + item.name + '" and all its contents?')) return;
      btn.textContent = 'Removing…';
      btn.disabled = true;
      fetch('/api/scan/folder', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: item.path }),
      })
        .then(r => r.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          card.remove();
          _scanItems[i] = null;
          const remaining = _scanItems.filter(Boolean).length;
          const countEl = document.querySelector('.scan-count');
          if (countEl) countEl.textContent = remaining + ' folder' + (remaining !== 1 ? 's' : '') + ' found';
          if (!remaining) document.getElementById('scan-results').innerHTML = '<div class="scan-empty">No media folders found.</div>';
        })
        .catch(err => {
          alert('Remove failed: ' + err.message);
          btn.textContent = 'Remove';
          btn.disabled = false;
        });
    }

    // ── Logs ──────────────────────────────────────────────────────────────────
    let lastId = 0;
    const output = document.getElementById('log-output');

    function clearLog() { output.innerHTML = ''; }

    function appendLogs(entries) {
      if (!entries.length) return;
      const atBottom = output.scrollHeight - output.scrollTop <= output.clientHeight + 4;
      for (const e of entries) {
        const line = document.createElement('div');
        line.className = 'log-line log-' + e.type;
        const ts     = `<span class="log-ts">${escHtml(e.ts)}</span>`;
        const prefix = e.prefix ? `<span class="log-prefix">${escHtml(e.prefix)}</span>` : '';
        const label  = e.type === 'error' ? 'ERROR: ' : '';
        line.innerHTML = `${ts}${prefix}<span class="log-msg">${label}${escHtml(e.message)}</span>`;
        output.appendChild(line);
        lastId = e.id;
      }
      if (atBottom) output.scrollTop = output.scrollHeight;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function pollLogs() {
      fetch('/api/logs?after=' + lastId)
        .then(r => r.json()).then(appendLogs).catch(() => {});
    }

    // ── Restart ───────────────────────────────────────────────────────────────
    function restart() {
      const btn = event.currentTarget;
      btn.textContent = 'Restarting…';
      btn.disabled = true;
      fetch('/api/restart', { method: 'POST' })
        .catch(() => {})
        .finally(() => {
          // Poll until the server is back up, then reload
          const poll = setInterval(() => {
            fetch('/api/logs?after=0')
              .then(() => { clearInterval(poll); location.reload(); })
              .catch(() => {});
          }, 1000);
        });
    }

    // ── Downloads ─────────────────────────────────────────────────────────────
    function fmtBytes(b) {
      if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
      if (b >= 1048576)    return (b / 1048576).toFixed(1)  + ' MB';
      if (b >= 1024)       return (b / 1024).toFixed(0)     + ' KB';
      return b + ' B';
    }
    function fmtSpeed(bps) { return bps > 0 ? fmtBytes(bps) + '/s' : ''; }
    function fmtEta(s) {
      if (!s || s < 0) return '';
      if (s < 60)   return s + 's';
      if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
      return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    }

    function renderDownloads(data) {
      const badge = document.getElementById('dl-state-badge');
      const state = (data.controller_state || '').toUpperCase();
      badge.textContent = state || '—';
      badge.className = 'dl-state-badge'
        + (state === 'RUNNING' ? ' running' : state === 'PAUSE' ? ' paused' : ' stopped');

      const list = document.getElementById('dl-list');
      const pkgs = data.packages || [];
      if (!pkgs.length) {
        list.innerHTML = '<div class="dl-empty">No active downloads.</div>';
        return;
      }
      list.innerHTML = pkgs.map(pkg => {
        const pct     = pkg.percent ?? 0;
        const running = pkg.running && !pkg.finished;
        const finished = pkg.finished;
        const fillCls = finished ? ' finished' : (!running ? ' stopped' : '');
        const statusCls = finished ? 'finished' : (running ? 'running' : '');
        const statusTxt = pkg.status || (finished ? 'Finished' : running ? 'Running' : 'Stopped');
        const speed = running ? fmtSpeed(pkg.speed_bps) : '';
        const eta   = running ? fmtEta(pkg.eta_seconds)  : '';
        const size  = pkg.bytes_total > 0
          ? fmtBytes(pkg.bytes_loaded) + ' / ' + fmtBytes(pkg.bytes_total)
          : (pkg.bytes_loaded > 0 ? fmtBytes(pkg.bytes_loaded) : '');
        return `
        <div class="dl-item">
          <div class="dl-item-top">
            <span class="dl-item-name" title="${escHtml(pkg.name || '')}">${escHtml(pkg.name || 'Unknown')}</span>
            <span class="dl-item-status ${statusCls}">${escHtml(statusTxt)}</span>
          </div>
          <div class="dl-progress-track">
            <div class="dl-progress-fill${fillCls}" style="width:${pct}%"></div>
          </div>
          <div class="dl-item-meta">
            <span class="dl-meta-pct">${pct}%</span>
            ${size   ? `<span>${escHtml(size)}</span>` : ''}
            ${speed  ? `<span class="dl-meta-speed">${escHtml(speed)}</span>` : ''}
            ${eta    ? `<span>ETA ${escHtml(eta)}</span>` : ''}
          </div>
          <div class="dl-item-footer">
            <button class="btn-pkg btn-pkg-start"  onclick="dlPkgStart(${pkg.uuid},this)">&#9654; Start</button>
            <button class="btn-pkg btn-pkg-stop"   onclick="dlPkgStop(${pkg.uuid},this)">&#9646;&#9646; Stop</button>
            <button class="btn-pkg btn-pkg-remove" onclick="dlPkgRemove(${pkg.uuid},this)">&#10005; Remove</button>
          </div>
        </div>`;
      }).join('');
    }

    function pollDownloads() {
      fetch('/api/downloads')
        .then(r => r.json())
        .then(renderDownloads)
        .catch(() => {});
    }

    function dlStart() {
      const btn = document.getElementById('btn-dl-start');
      btn.disabled = true;
      fetch('/api/downloads/start', { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlStop() {
      const btn = document.getElementById('btn-dl-stop');
      btn.disabled = true;
      fetch('/api/downloads/stop', { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlPkgStart(uuid, btn) {
      btn.disabled = true;
      fetch(`/api/downloads/${uuid}/start`, { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlPkgStop(uuid, btn) {
      btn.disabled = true;
      fetch(`/api/downloads/${uuid}/stop`, { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlPkgRemove(uuid, btn) {
      btn.disabled = true;
      fetch(`/api/downloads/${uuid}`, { method: 'DELETE' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    pollDownloads();
    setInterval(pollDownloads, 4000);

    pollLogs();
    setInterval(pollLogs, 2000);
  </script>
</body>
</html>
