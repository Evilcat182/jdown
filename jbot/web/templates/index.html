<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#172026" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e9eff1" media="(prefers-color-scheme: light)">
  <title>jbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/jbot.css">
</head>
<body class="js-tabs">

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="wordmark" aria-label="jbot home">
        <span class="wordmark-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
        </span>
        jbot
      </a>
      <span id="dl-state-badge" class="state">Connecting</span>
      <span id="speed-total" class="speed-total"></span>
      <span class="topbar-spacer"></span>
      <div class="topbar-actions">
        <a class="btn btn-quiet btn-sm" id="link-jdownloader" data-port="5800" data-scheme="https" target="_blank" rel="noopener" title="Open JDownloader in a new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 7v7"/><path d="M8.5 11l3.5 3.5 3.5-3.5"/><path d="M8 17.5h8"/></svg>
          <span class="btn-label">JDownloader</span>
        </a>
        <a class="btn btn-quiet btn-sm" id="link-firefox" data-port="5801" data-scheme="http" target="_blank" rel="noopener" title="Open Firefox in a new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>
          <span class="btn-label">Firefox</span>
        </a>
        <button class="btn btn-quiet btn-sm" onclick="restart(this)" title="Restart jbot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          <span class="btn-label">Restart</span>
        </button>
        <a href="/settings" class="btn btn-quiet btn-sm btn-icon topbar-settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="dash">
      <div class="dash-main">

        <!-- Downloads + copy activity -->
        <div data-pane="downloads" class="active">
          <section>
            <div class="section-head">
              <h2 class="section-title">Downloads <span id="dl-count" class="count" hidden></span></h2>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-quiet btn-sm" id="btn-dl-stop" onclick="dlStop()">
                  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                  Stop all
                </button>
                <button class="btn btn-primary btn-sm" id="btn-dl-start" onclick="dlStart()">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
                  Start all
                </button>
              </div>
            </div>
            <div id="dl-list"></div>
          </section>

          <!-- Copy activity (visible whenever a copy job is running, survives reload) -->
          <section id="copy-section" style="display:none;margin-top:36px;">
            <div class="section-head">
              <h2 class="section-title">Copying to library</h2>
            </div>
            <div id="copy-list" class="lane-list"></div>
          </section>
        </div>

        <!-- Scan -->
        <section data-pane="sort" id="sort">
          <div class="section-head">
            <div>
              <h2 class="section-title">Sort into library</h2>
              <p class="section-sub">Find finished downloads in the output folder, check what was detected, then move them into your movie or series library.</p>
            </div>
            <button id="btn-scan" class="btn btn-primary" onclick="scanFolder()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <span>Scan folder</span>
            </button>
          </div>
          <div id="scan-results"></div>
        </section>

      </div>

      <!-- Log -->
      <aside class="dash-side" data-pane="log">
        <div class="log-panel">
          <div class="log-header">
            <span class="log-title"><span class="live-dot" aria-hidden="true"></span>Live log</span>
            <button class="btn btn-quiet btn-sm" onclick="clearLog()">Clear</button>
          </div>
          <div id="log-output" role="log" aria-live="polite"></div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Mobile tab bar -->
  <nav class="tabbar" aria-label="Sections">
    <button class="tab active" data-tab="downloads" onclick="showPane('downloads')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
      Downloads
      <span class="tab-badge" id="tab-badge-downloads" hidden></span>
    </button>
    <button class="tab" data-tab="sort" onclick="showPane('sort')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13l2 2 4-4"/></svg>
      Sort
      <span class="tab-badge" id="tab-badge-sort" hidden></span>
    </button>
    <button class="tab" data-tab="log" onclick="showPane('log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      Log
    </button>
    <a class="tab" href="/settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="18" r="2" fill="var(--surface)"/></svg>
      Settings
    </a>
  </nav>

  <script>
    const ICON = {
      play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M9 6V4h6v2"/></svg>',
    };

    // ── JDownloader / Firefox web UIs (published on the gluetun container, same host as jbot) ──
    document.querySelectorAll('#link-jdownloader, #link-firefox').forEach(a => {
      a.href = `${a.dataset.scheme}://${location.hostname}:${a.dataset.port}/`;
    });

    // ── Mobile panes ──────────────────────────────────────────────────────────
    function showPane(name) {
      document.querySelectorAll('[data-pane]').forEach(el => el.classList.toggle('active', el.dataset.pane === name));
      document.querySelectorAll('.tab[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === name));
      try { sessionStorage.setItem('jbot-pane', name); } catch (e) {}
      if (name === 'log') output.scrollTop = output.scrollHeight;
      window.scrollTo(0, 0);
    }

    function setBadge(id, n) {
      const el = document.getElementById(id);
      el.hidden = !n;
      el.textContent = n || '';
    }

    // ── Scan ──────────────────────────────────────────────────────────────────
    let _scanItems = [];

    function scanFolder() {
      const btn = document.getElementById('btn-scan');
      const label = btn.querySelector('span');
      label.textContent = 'Scanning…';
      btn.disabled = true;
      document.getElementById('scan-results').innerHTML = '';
      fetch('/api/scan')
        .then(r => r.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          _scanItems = data;
          renderScanResults(data);
        })
        .catch(err => {
          document.getElementById('scan-results').innerHTML =
            `<div class="empty is-error">Scan failed: ${escHtml(err.message || String(err))}</div>`;
        })
        .finally(() => { label.textContent = 'Scan folder'; btn.disabled = false; });
    }

    function scanEmpty() {
      return '<div class="empty"><strong>Nothing to sort</strong>The output folder has no finished downloads right now.</div>';
    }

    function renderScanResults(items) {
      const container = document.getElementById('scan-results');
      setBadge('tab-badge-sort', items.length);
      if (!items.length) {
        container.innerHTML = scanEmpty();
        return;
      }
      const header = `
        <div class="scan-bar">
          <span class="scan-count">${items.length} folder${items.length !== 1 ? 's' : ''} found</span>
          <button class="btn btn-quiet btn-sm" onclick="organizeAll()">Organize all</button>
        </div>`;
      const list = items.map((item, i) => renderScanItem(item, i)).join('');
      container.innerHTML = header + '<div class="scan-list">' + list + '</div>';
    }

    function renderScanItem(item, i) {
      const type = item.type || '';
      const tagCls = type === 'movie' ? 'movie' : type === 'episode' ? 'episode' : '';
      const warnTag = item.has_confidence ? '' : '<span class="tag warn" title="Few quality fields were detected, check the values below">Check details</span>';
      const info = item.info || {};
      const lowCls = item.has_confidence ? '' : ' low-confidence';
      const v = (key, fallback = '') => escHtml(String(info[key] ?? fallback));
      const inp = (cls, key, placeholder = '') =>
        `<input class="input ${cls}" id="f${i}-${cls}" value="${v(key)}" placeholder="${escHtml(placeholder)}" autocomplete="off">`;
      const field = (label, cls, html, extra = '') =>
        `<div class="field${extra}"><label class="field-label" for="f${i}-${cls}">${label}</label>${html}</div>`;
      const epHidden = type !== 'episode' ? ' style="display:none"' : '';
      const ep = (label, cls, key, ph) =>
        `<div class="field field-ep"${epHidden}><label class="field-label" for="f${i}-${cls}">${label}</label>${inp(cls, key, ph)}</div>`;
      return `
      <article class="scan-item${lowCls}" id="scan-item-${i}">
        <div class="scan-item-header">
          <span class="scan-item-name">${escHtml(item.name)}</span>
          <div class="scan-item-badges">
            ${warnTag}
            <span class="tag type-tag ${tagCls}">${type ? (type === 'episode' ? 'Episode' : 'Movie') : 'Unknown'}</span>
          </div>
        </div>
        <div class="scan-fields">
          ${field('Type', 'field-type', `
            <select class="input field-type" id="f${i}-field-type" onchange="onTypeChange(this,${i})">
              <option value="movie"   ${type==='movie'   ? 'selected' : ''}>Movie</option>
              <option value="episode" ${type==='episode' ? 'selected' : ''}>Episode</option>
            </select>`)}
          ${field('Title', 'field-title', inp('field-title', 'title'), ' field-wide')}
          ${field('Year', 'field-year', inp('field-year', 'year', 'e.g. 2024'))}
          ${ep('Season', 'field-season', 'season', 'e.g. 1')}
          ${ep('Episode', 'field-episode', 'episode', 'e.g. 4')}
          ${ep('Episode title', 'field-episode-title', 'episode_title', '')}
          ${field('Resolution', 'field-screen-size', inp('field-screen-size', 'screen_size', 'e.g. 1080p'))}
          ${field('Video codec', 'field-video-codec', inp('field-video-codec', 'video_codec', 'e.g. x265'))}
          ${field('Source', 'field-source', inp('field-source', 'source', 'e.g. BluRay'))}
          ${field('Audio codec', 'field-audio-codec', inp('field-audio-codec', 'audio_codec', 'e.g. DTS'))}
        </div>
        <div class="scan-item-footer">
          <button class="btn btn-danger btn-sm btn-remove" onclick="removeFolder(${i})">Delete folder</button>
          <button class="btn btn-primary btn-sm btn-org" onclick="organizeItem(${i})">Organize</button>
        </div>
      </article>`;
    }

    function onTypeChange(sel, i) {
      const card = document.getElementById('scan-item-' + i);
      const isEpisode = sel.value === 'episode';
      card.querySelectorAll('.field-ep').forEach(el => el.style.display = isEpisode ? '' : 'none');
      const tag = card.querySelector('.type-tag');
      tag.className = 'tag type-tag ' + (isEpisode ? 'episode' : 'movie');
      tag.textContent = isEpisode ? 'Episode' : 'Movie';
    }

    function getItemInfo(i) {
      const card = document.getElementById('scan-item-' + i);
      const gv = cls => (card.querySelector('.' + cls)?.value ?? '').trim();
      return {
        type:          gv('field-type') || undefined,
        title:         gv('field-title') || undefined,
        year:          gv('field-year') || undefined,
        season:        gv('field-season') || undefined,
        episode:       gv('field-episode') || undefined,
        episode_title: gv('field-episode-title') || undefined,
        screen_size:   gv('field-screen-size') || undefined,
        video_codec:   gv('field-video-codec') || undefined,
        source:        gv('field-source') || undefined,
        audio_codec:   gv('field-audio-codec') || undefined,
      };
    }

    function organizeItem(i) {
      const item = _scanItems[i];
      if (!item) return;
      const card = document.getElementById('scan-item-' + i);
      const btn  = card.querySelector('.btn-org');
      btn.textContent = 'Organizing…';
      btn.disabled = true;
      _orgPending.add(i);
      // Clear previous errors
      card.querySelectorAll('.scan-item-errors').forEach(el => el.remove());
      card.classList.remove('has-error');
      // Progress bar is created/updated by the global copy-progress poller
      fetch('/api/organize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: item.path, info: getItemInfo(i) }),
      })
        .then(r => r.json())
        .then(data => {
          if (data.errors && data.errors.length) {
            card.classList.add('has-error');
            const errBox = document.createElement('div');
            errBox.className = 'scan-item-errors';
            errBox.innerHTML = data.errors.map(e =>
              `<div class="scan-item-error">${escHtml(e)}</div>`
            ).join('');
            card.querySelector('.scan-item-footer').before(errBox);
          } else {
            card.classList.add('organized');
          }
        })
        .catch(() => {})
        .finally(() => {
          _orgPending.delete(i);
          btn.textContent = card.classList.contains('organized') ? 'Organized' : 'Organize';
          btn.disabled = false;
          // Remove the progress bar once the server-side job is gone
          if (!_activeJobs[item.path]) card.querySelector('.scan-item-progress')?.remove();
        });
    }

    function organizeAll() { _scanItems.forEach((_, i) => organizeItem(i)); }

    function removeFolder(i) {
      const item = _scanItems[i];
      if (!item) return;
      const card = document.getElementById('scan-item-' + i);
      const btn  = card.querySelector('.btn-remove');
      if (!confirm('Delete "' + item.name + '" and all its contents?')) return;
      btn.textContent = 'Deleting…';
      btn.disabled = true;
      fetch('/api/scan/folder', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: item.path }),
      })
        .then(r => r.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          card.remove();
          _scanItems[i] = null;
          const remaining = _scanItems.filter(Boolean).length;
          setBadge('tab-badge-sort', remaining);
          const countEl = document.querySelector('.scan-count');
          if (countEl) countEl.textContent = remaining + ' folder' + (remaining !== 1 ? 's' : '') + ' found';
          if (!remaining) document.getElementById('scan-results').innerHTML = scanEmpty();
        })
        .catch(err => {
          alert('Delete failed: ' + err.message);
          btn.textContent = 'Delete folder';
          btn.disabled = false;
        });
    }

    // ── Logs ──────────────────────────────────────────────────────────────────
    let lastId = 0;
    const output = document.getElementById('log-output');

    function clearLog() { output.innerHTML = ''; }

    function appendLogs(entries) {
      if (!entries.length) return;
      const atBottom = output.scrollHeight - output.scrollTop <= output.clientHeight + 4;
      for (const e of entries) {
        const line = document.createElement('div');
        line.className = 'log-line log-' + e.type;
        const ts     = `<span class="log-ts">${escHtml(e.ts)}</span>`;
        const prefix = e.prefix ? `<span class="log-prefix">${escHtml(e.prefix)}</span>` : '';
        const label  = e.type === 'error' ? 'Error: ' : '';
        line.innerHTML = `${ts}${prefix}<span class="log-msg">${label}${escHtml(e.message)}</span>`;
        output.appendChild(line);
        lastId = e.id;
      }
      if (atBottom) output.scrollTop = output.scrollHeight;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function pollLogs() {
      fetch('/api/logs?after=' + lastId)
        .then(r => r.json()).then(appendLogs).catch(() => {});
    }

    // ── Restart ───────────────────────────────────────────────────────────────
    function restart(btn) {
      btn.querySelector('.btn-label').textContent = 'Restarting…';
      btn.disabled = true;
      fetch('/api/restart', { method: 'POST' })
        .catch(() => {})
        .finally(() => {
          // Poll until the server is back up, then reload
          const poll = setInterval(() => {
            fetch('/api/logs?after=0')
              .then(() => { clearInterval(poll); location.reload(); })
              .catch(() => {});
          }, 1000);
        });
    }

    // ── Downloads ─────────────────────────────────────────────────────────────
    function fmtBytes(b) {
      if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
      if (b >= 1048576)    return (b / 1048576).toFixed(1)  + ' MB';
      if (b >= 1024)       return (b / 1024).toFixed(0)     + ' KB';
      return b + ' B';
    }
    function fmtSpeed(bps) { return bps > 0 ? fmtBytes(bps) + '/s' : ''; }
    function fmtEta(s) {
      if (!s || s < 0) return '';
      if (s < 60)   return s + 's';
      if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
      return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    }
    function fmtPct(p) {
      const n = Math.round(Number(p) || 0);
      return `${n}<small>%</small>`;
    }

    const STATE_LABEL = { RUNNING: 'Running', PAUSE: 'Paused', IDLE: 'Idle', STOPPED: 'Stopped', STOPPING: 'Stopping' };

    function renderDownloads(data) {
      const badge = document.getElementById('dl-state-badge');
      const state = (data.controller_state || '').toUpperCase();
      badge.textContent = STATE_LABEL[state] || (state ? state.charAt(0) + state.slice(1).toLowerCase() : 'Unknown');
      badge.className = 'state'
        + (state === 'RUNNING' ? ' running' : state === 'PAUSE' ? ' paused' : '');

      const list = document.getElementById('dl-list');
      const pkgs = data.packages || [];
      const active = pkgs.filter(p => p.running && !p.finished);
      const totalBps = active.reduce((sum, p) => sum + (p.speed_bps || 0), 0);
      document.getElementById('speed-total').textContent = totalBps > 0 ? fmtSpeed(totalBps) : '';
      setBadge('tab-badge-downloads', active.length);
      const count = document.getElementById('dl-count');
      count.hidden = !pkgs.length;
      count.textContent = pkgs.length;

      if (!pkgs.length) {
        list.className = '';
        list.innerHTML = '<div class="empty"><strong>Queue is empty</strong>Links added in JDownloader show up here.</div>';
        return;
      }
      list.className = 'lane-list';
      list.innerHTML = pkgs.map(pkg => {
        const pct      = pkg.percent ?? 0;
        const running  = pkg.running && !pkg.finished;
        const finished = pkg.finished;
        const laneCls  = finished ? ' is-finished' : (running ? ' is-running' : '');
        const statusTxt = pkg.status || (finished ? 'Finished' : running ? 'Downloading' : 'Stopped');
        const speed = running ? fmtSpeed(pkg.speed_bps) : '';
        const eta   = running ? fmtEta(pkg.eta_seconds)  : '';
        const size  = pkg.bytes_total > 0
          ? fmtBytes(pkg.bytes_loaded) + ' of ' + fmtBytes(pkg.bytes_total)
          : (pkg.bytes_loaded > 0 ? fmtBytes(pkg.bytes_loaded) : '');
        const name = escHtml(pkg.name || 'Unknown');
        return `
        <div class="lane${laneCls}">
          <div class="lane-fill" style="width:${pct}%"></div>
          <div class="lane-top">
            <span class="lane-name" title="${name}">${name}</span>
            <span class="lane-pct">${fmtPct(pct)}</span>
          </div>
          <div class="lane-bottom">
            <div class="lane-meta">
              <span class="lane-status">${escHtml(statusTxt)}</span>
              ${size  ? `<span>${escHtml(size)}</span>` : ''}
              ${speed ? `<span>${escHtml(speed)}</span>` : ''}
              ${eta   ? `<span>${escHtml(eta)} left</span>` : ''}
            </div>
            <div class="lane-actions">
              <button class="btn btn-quiet btn-sm" onclick="dlPkgStart(${pkg.uuid},this)" title="Start this package">${ICON.play}Start</button>
              <button class="btn btn-quiet btn-sm" onclick="dlPkgStop(${pkg.uuid},this)" title="Stop this package">${ICON.pause}Stop</button>
              <button class="btn btn-danger btn-sm btn-icon" onclick="dlPkgRemove(${pkg.uuid},this)" title="Remove from queue" aria-label="Remove ${name} from queue">${ICON.trash}</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function pollDownloads() {
      fetch('/api/downloads')
        .then(r => r.json())
        .then(renderDownloads)
        .catch(() => {});
    }

    function dlStart() {
      const btn = document.getElementById('btn-dl-start');
      btn.disabled = true;
      fetch('/api/downloads/start', { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlStop() {
      const btn = document.getElementById('btn-dl-stop');
      btn.disabled = true;
      fetch('/api/downloads/stop', { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlPkgStart(uuid, btn) {
      btn.disabled = true;
      fetch(`/api/downloads/${uuid}/start`, { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlPkgStop(uuid, btn) {
      btn.disabled = true;
      fetch(`/api/downloads/${uuid}/stop`, { method: 'POST' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    function dlPkgRemove(uuid, btn) {
      btn.disabled = true;
      fetch(`/api/downloads/${uuid}`, { method: 'DELETE' })
        .then(() => pollDownloads())
        .catch(() => {})
        .finally(() => { btn.disabled = false; });
    }

    // ── Copy progress (poll-driven, survives page reload) ────────────────────
    let _activeJobs = {};        // source path -> job
    const _orgPending = new Set(); // scan item indexes with an in-flight organize request

    function ensureItemProgressBar(card) {
      let prog = card.querySelector('.scan-item-progress');
      if (!prog) {
        prog = document.createElement('div');
        prog.className = 'scan-item-progress';
        prog.innerHTML = `
          <div class="bar"><div class="bar-fill" style="width:0%"></div></div>
          <div class="scan-item-progress-meta">
            <span class="pct">0%</span>
            <span class="bytes"></span>
          </div>`;
        card.querySelector('.scan-item-footer').before(prog);
      }
      return prog;
    }

    function renderCopySection() {
      const sec  = document.getElementById('copy-section');
      const list = document.getElementById('copy-list');
      const jobs = Object.values(_activeJobs);
      if (!jobs.length) { sec.style.display = 'none'; list.innerHTML = ''; return; }
      sec.style.display = '';
      list.innerHTML = jobs.map(j => `
        <div class="lane is-copying">
          <div class="lane-fill" style="width:${j.percent}%"></div>
          <div class="lane-top">
            <span class="lane-name" title="${escHtml(j.name)}">${escHtml(j.name)}</span>
            <span class="lane-pct">${fmtPct(j.percent)}</span>
          </div>
          <div class="lane-bottom">
            <div class="lane-meta">
              <span class="lane-status">Copying</span>
              <span>${fmtBytes(j.copied_bytes)} of ${fmtBytes(j.total_bytes)}</span>
            </div>
          </div>
        </div>`).join('');
    }

    function syncScanItemProgress() {
      _scanItems.forEach((item, i) => {
        if (!item) return;
        const card = document.getElementById('scan-item-' + i);
        if (!card) return;
        const btn = card.querySelector('.btn-org');
        const job = _activeJobs[item.path];
        if (job) {
          const el = ensureItemProgressBar(card);
          el.querySelector('.bar-fill').style.width = job.percent + '%';
          el.querySelector('.pct').textContent = job.percent + '%';
          el.querySelector('.bytes').textContent = fmtBytes(job.copied_bytes) + ' of ' + fmtBytes(job.total_bytes);
          btn.textContent = 'Organizing…';
          btn.disabled = true;
        } else if (!_orgPending.has(i)) {
          // Job finished and no local request is still in flight → reset card
          card.querySelector('.scan-item-progress')?.remove();
          if (!card.classList.contains('organized')) {
            btn.textContent = 'Organize';
            btn.disabled = false;
          }
        }
      });
    }

    function pollCopyProgress() {
      fetch('/api/organize/progress')
        .then(r => r.json())
        .then(data => {
          _activeJobs = {};
          (data.jobs || []).forEach(j => { _activeJobs[j.path] = j; });
          renderCopySection();
          syncScanItemProgress();
        })
        .catch(() => {});
    }

    try {
      const saved = sessionStorage.getItem('jbot-pane');
      if (saved && saved !== 'downloads') showPane(saved);
    } catch (e) {}

    pollCopyProgress();
    setInterval(pollCopyProgress, 1000);

    pollDownloads();
    setInterval(pollDownloads, 4000);

    pollLogs();
    setInterval(pollLogs, 2000);
  </script>
</body>
</html>
